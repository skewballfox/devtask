name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python devtask supports and the newest.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release preview needs the tags and history

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}

      - run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Type-check
        run: uv run ty check src hooks scripts

      - name: Check the plugin and package versions match
        run: |
          plugin=$(jq -r .version .claude-plugin/plugin.json)
          package=$(uv version --short)
          if [ "$plugin" != "$package" ]; then
            echo "::error::plugin.json says $plugin but pyproject.toml says $package"
            exit 1
          fi

      - name: Smoke-test the CLI, git hook and Claude guard
        run: |
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          export HOME="$RUNNER_TEMP/home" GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig"
          mkdir -p "$HOME"
          git config --global user.name ci
          git config --global user.email ci@example.com

          repo="$RUNNER_TEMP/repo"
          git init -q "$repo" && cd "$repo"
          echo 'fn main() {}' > main.rs
          git add main.rs && git commit -qm init

          devtask init
          devtask completions fish > /dev/null
          git config --local --get hook.devtask-pre-commit.command
          if git config --global --get hook.devtask-pre-commit.command; then
            echo "::error::devtask init installed a global hook"
            exit 1
          fi

          printf '// #DEVTASK_ci-1\nfn main() {}\n' > main.rs
          git add main.rs
          if devtask git-hook pre-commit; then
            echo "::error::the pre-commit check let a tag through"
            exit 1
          fi
          # Git itself must run it, alongside a hooks-directory script like pre-commit's.
          printf '#!/bin/sh\ntouch "$(git rev-parse --git-dir)/script-ran"\n' > .git/hooks/pre-commit
          chmod +x .git/hooks/pre-commit
          if git commit -qm tagged; then
            echo "::error::git committed a tag"
            exit 1
          fi
          test -e .git/script-ran

          # The plugin runs the guard with the system python3, so test it that way.
          input=$(jq -n --arg cwd "$repo" \
            '{tool_name: "Write", cwd: $cwd, tool_input: {file_path: "main.rs", content: "x"}}')
          echo "$input" | python3 "$GITHUB_WORKSPACE/hooks/guard.py" pre-tool-use \
            | jq -e '.hookSpecificOutput.permissionDecision == "deny"'

      - name: Smoke-test random devtask mode
        run: |
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          export HOME="$RUNNER_TEMP/home2" GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig2"
          mkdir -p "$HOME"
          git config --global user.name ci
          git config --global user.email ci@example.com
          git config --global init.defaultBranch main

          repo="$RUNNER_TEMP/repo2"
          git init -q "$repo" && cd "$repo"
          mkdir src && echo 'fn main() {}' > src/a.rs && echo hi > README.md
          git add -A && git commit -qm init
          guard() { python3 "$GITHUB_WORKSPACE/hooks/guard.py" "$@"; }
          call() {  # tool, tool_input, tool_use_id
            jq -nc --arg t "$1" --argjson i "$2" --arg id "$3" --arg cwd "$repo" \
              '{tool_name: $t, tool_input: $i, tool_use_id: $id, cwd: $cwd, session_id: "s1"}'
          }
          code_edit='{"file_path": "src/a.rs", "old_string": "fn main() {}", "new_string": "fn main() { x }"}'

          # The guard stays off; rolls decide. Project settings beat global ones.
          devtask init --randomize 1
          test ! -e "$(devtask path --state)/guard"
          devtask config --global randomize 0
          test "$(devtask config randomize)" = "1.0 (project)"

          # on_branch (default): a new branch rolls after the tool call.
          call Bash '{"command": "git switch -c feat"}' b1 | guard pre-tool-use
          git switch -qc feat
          call Bash '{"command": "git switch -c feat"}' b1 | guard post-tool-use \
            | jq -e '.hookSpecificOutput.additionalContext | contains("devtask mode is now ON")'
          call Edit "$code_edit" e1 | guard pre-tool-use \
            | jq -e '.hookSpecificOutput.permissionDecision == "deny"'
          git switch -q main
          test -z "$(call Edit "$code_edit" e2 | guard pre-tool-use)"

          # Opting a task out needs the user's approval.
          call Bash '{"command": "devtask skip branch:feat"}' s1 | guard pre-tool-use \
            | jq -e '.hookSpecificOutput.permissionDecision == "ask"'

          # on_edit: the first code edit rolls; docs edits don't.
          devtask config randomization_strategy on_edit
          git switch -qc ed
          test -z "$(call Edit '{"file_path": "README.md", "old_string": "hi", "new_string": "yo"}' e3 \
            | guard pre-tool-use)"
          call Edit "$code_edit" e4 | guard pre-tool-use \
            | jq -e '.hookSpecificOutput.permissionDecisionReason | contains("devtask mode is now ON")'

      - name: Preview the next release
        if: matrix.python == '3.14'
        run: uv run scripts/next_version.py --github
