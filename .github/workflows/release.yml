name: Release

# Run from the Actions tab (or `gh workflow run release.yml`). With "auto",
# scripts/next_version.py picks the bump from the commit messages and the CLI
# surface since the last tag; the other choices force a level.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto

concurrency:
  group: release

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.0

      - run: uv sync --locked

      - name: Work out the next version
        id: next
        run: uv run scripts/next_version.py --bump "$BUMP" --github
        env:
          BUMP: ${{ inputs.bump }}

      - name: Set the version and write the changelog
        if: steps.next.outputs.release == 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          uv version --no-sync "$VERSION"
          jq --arg v "$VERSION" '.version = $v' .claude-plugin/plugin.json > plugin.json.tmp
          mv plugin.json.tmp .claude-plugin/plugin.json
          uv run git-cliff --tag "v$VERSION" --output CHANGELOG.md
          uv run git-cliff --tag "v$VERSION" --unreleased --strip all > "$RUNNER_TEMP/notes.md"

      - name: Commit, tag and push
        if: steps.next.outputs.release == 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock .claude-plugin/plugin.json CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"

      - name: Publish the GitHub release
        if: steps.next.outputs.release == 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          uv build
          gh release create "v$VERSION" dist/* --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
